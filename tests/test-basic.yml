name: Test basic deploy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@dokku.example.com:22/myapp"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACBY2ovnFRmBnGMoSMcHqnSl1oBFGGqn5bktagEAAAAwAAAAtzc2gtZWQy
            NTUxOQAAAEDummydummydummydummydummydummydummydummydummydummydummy
            AAAAFHRlc3RAZXhhbXBsZS5jb20=
            -----END OPENSSH PRIVATE KEY-----
          branch: master
          command: deploy
      - name: Assert action ran (may fail due to no real Dokku server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
