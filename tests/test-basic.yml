name: Test basic deploy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a throwaway SSH key pair for testing
        id: keygen
        run: |
          ssh-keygen -t rsa -b 2048 -N "" -f /tmp/test_deploy_key
          PRIVATE_KEY="$(cat /tmp/test_deploy_key)"
          echo "private_key<<EOF" >> "$GITHUB_OUTPUT"
          echo "$PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@localhost:22/test-app"
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          branch: master
          command: deploy
      - name: Assert action ran (connection failure is expected in test environment)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because there is no real Dokku server.
          # We only verify that the required inputs were accepted and the action
          # attempted to run (i.e., it did not fail due to missing inputs).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with required inputs (connection failure is expected)"
