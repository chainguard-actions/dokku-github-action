---
name: Test docker image deploy command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH key
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run docker image deploy action (expected to fail with SSH error)
        id: action
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@192.0.2.1/test-app"
          ssh_private_key: ${{ env.TEST_SSH_KEY }}
          command: deploy
          deploy_docker_image: "nginx:latest"
          deploy_user_name: "testuser"
          deploy_user_email: "testuser@example.com"

      - name: Assert action failed (SSH unreachable, not config error)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: expected action to fail (no real Dokku server)"
            exit 1
          fi
          echo "PASS: action failed as expected (no real Dokku server reachable)"
