---
name: Test docker image deploy invocation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run dokku deploy with docker image (expect SSH failure, not input error)
        id: action
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@dokku.example.com:22/myapp"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACBY2FtZXJhLXRlc3Qta2V5LXBsYWNlaG9sZGVyLWZha2UAAAAkAAAAIH
            Rlc3Qta2V5LXBsYWNlaG9sZGVyLWZha2UtdGVzdAAAABNzc2gtZWQyNTUxOQAAAAAAAA
            AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            -----END OPENSSH PRIVATE KEY-----
          command: deploy
          deploy_docker_image: "ghcr.io/myorg/myapp:latest"
          deploy_user_name: "github-actions"
          deploy_user_email: "github-actions@example.com"
          branch: main

      - name: Assert action was invoked for docker image deploy
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail due to SSH connectivity (no real Dokku server),
          # not due to missing required inputs or invalid docker image config.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: docker image deploy action was invoked (outcome=$OUTCOME)"
