name: Test SSH host key input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate test SSH key pair and fake host key
        id: keygen
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          PRIVATE_KEY="$(cat /tmp/test_key)"
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          # Generate a fake host key entry (not a real server)
          ssh-keygen -t rsa -b 2048 -f /tmp/host_key -N "" -q
          HOST_KEY="192.0.2.1 $(cat /tmp/host_key.pub)"
          echo "host_key=$HOST_KEY" >> $GITHUB_OUTPUT
      - name: Test action with ssh_host_key input fails with unreachable host
        id: action
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@192.0.2.1/test-app"
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          ssh_host_key: ${{ steps.keygen.outputs.host_key }}
          branch: "master"
      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable host, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when host is unreachable (even with host key provided)"
