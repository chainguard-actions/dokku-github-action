name: Test git push flags and trace mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a test SSH key pair
        id: keygen
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          PRIVATE_KEY="$(cat /tmp/test_key)"
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Test action with git_push_flags and trace enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@192.0.2.1/test-app"
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          git_push_flags: "--force"
          trace: "true"
          branch: "master"
      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable host, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when host is unreachable (with git_push_flags and trace)"
