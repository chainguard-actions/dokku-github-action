name: Test basic deploy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@dokku.example.com:22/my-app"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACBY2FtZXJhLXRlc3Qta2V5AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            -----END OPENSSH PRIVATE KEY-----
          branch: master
          command: deploy
      - name: Assert action was invoked with required inputs
        run: |
          echo "Action completed (possibly with expected SSH connection failure)"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because there is no real Dokku server,
          # but it should fail at the SSH/deploy stage, not at input validation.
          # We just verify the step ran (outcome is set).
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action did not run at all"
            exit 1
          fi
          echo "PASS: action was invoked with required inputs"
