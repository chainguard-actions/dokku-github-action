---
name: Test basic deploy inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/master
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Generate a throwaway SSH key for testing
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "TEST_SSH_KEY<<EOF" >> "$GITHUB_ENV"
          cat /tmp/test_key >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - id: action
        name: Run dokku deploy action (expected to fail at SSH connection)
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@127.0.0.1:22/testapp"
          ssh_private_key: ${{ env.TEST_SSH_KEY }}
          branch: master
          command: deploy

      - name: Assert action failed at SSH connection (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (can't connect to 127.0.0.1 in Docker)
          # but it should fail with 'failure' outcome, not 'success'
          # This proves the action started and processed inputs correctly
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (SSH connection refused, not input error)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded"
            exit 1
          else
            echo "PASS: action outcome was $OUTCOME (expected failure)"
          fi
