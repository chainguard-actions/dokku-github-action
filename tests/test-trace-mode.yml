---
name: Test trace mode with ssh_host_key input (expected failure at SSH)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a throwaway SSH key pair for testing
        id: keygen
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          PRIVATE_KEY="$(cat /tmp/test_key)"
          # Generate a fake host key entry (self-signed, not a real server)
          ssh-keygen -t rsa -b 2048 -f /tmp/host_key -N "" -q
          HOST_KEY="127.0.0.1 $(cat /tmp/host_key.pub)"
          echo "private_key<<EOF" >> "$GITHUB_OUTPUT"
          echo "$PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "host_key<<EOF" >> "$GITHUB_OUTPUT"
          echo "$HOST_KEY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@127.0.0.1:22/test-app"
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          ssh_host_key: ${{ steps.keygen.outputs.host_key }}
          branch: master
          command: deploy
          trace: "true"

      - name: Assert action failed (cannot connect to fake Dokku host)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to an unreachable host, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action with trace mode correctly failed when SSH target is unreachable"
