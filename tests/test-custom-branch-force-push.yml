---
name: Test custom branch and force push invocation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/develop
      GITHUB_EVENT_NAME: push
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run dokku deploy with custom branch and force push flags
        id: action
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@dokku.example.com:22/myapp"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACBY2FtZXJhLXRlc3Qta2V5LXBsYWNlaG9sZGVyLWZha2UAAAAkAAAAIH
            Rlc3Qta2V5LXBsYWNlaG9sZGVyLWZha2UtdGVzdAAAABNzc2gtZWQyNTUxOQAAAAAAAA
            AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            -----END OPENSSH PRIVATE KEY-----
          branch: master
          ci_branch_name: develop
          git_push_flags: "--force"
          command: deploy

      - name: Assert action was invoked with custom branch and force push
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail due to SSH connectivity (no real Dokku server),
          # not due to invalid inputs like git_push_flags or ci_branch_name.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: custom branch force push action was invoked (outcome=$OUTCOME)"
