---
name: Test review app create invocation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/42/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: master
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run dokku review-apps:create action (expect SSH failure, not input error)
        id: action
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@dokku.example.com:22/myapp"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACBY2FtZXJhLXRlc3Qta2V5LXBsYWNlaG9sZGVyLWZha2UAAAAkAAAAIH
            Rlc3Qta2V5LXBsYWNlaG9sZGVyLWZha2UtdGVzdAAAABNzc2gtZWQyNTUxOQAAAAAAAA
            AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            -----END OPENSSH PRIVATE KEY-----
          command: review-apps:create
          review_app_name: myapp-pr-42

      - name: Assert action was invoked for review app creation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail due to SSH connectivity (no real Dokku server),
          # not due to missing required inputs or invalid command.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: review-apps:create action was invoked (outcome=$OUTCOME)"
