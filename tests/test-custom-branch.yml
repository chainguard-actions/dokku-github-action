name: Test custom branch and git push flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/staging
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a dummy SSH key pair for testing
        id: gen-key
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          PRIVATE_KEY=$(cat /tmp/test_key)
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run action with custom branch and force push flag
        id: action
        uses: .
        continue-on-error: true
        with:
          git_remote_url: "ssh://dokku@dokku.example.com:22/staging-app"
          ssh_private_key: ${{ steps.gen-key.outputs.private_key }}
          branch: "main"
          git_push_flags: "--force"
          ci_branch_name: "staging"
          command: "deploy"

      - name: Assert action was invoked with custom branch inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should fail because it cannot connect to the fake server,
          # not because of bad inputs like branch or git_push_flags.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with custom branch inputs (outcome: ${{ steps.action.outcome }})"
